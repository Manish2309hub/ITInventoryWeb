
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">
    <title>IT Inventory Login</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eef2f7;
        }
        .login-box {
            background: white;
            width: 320px;
            max-width: 90%;
            margin: 100px auto;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px #ccc;
        }
        input, button {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            margin: 10px 0;
        }
        button {
            background: #174a7e;
            color: white;
            border: none;
            cursor: pointer;
        }
        .error {
            color: #b00020;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>IT Inventory Login</h2>

        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}

        <form method="POST">
            <input type="hidden" name="csrf_token"
                   value="{{ csrf_token }}">

            <label>Username</label>
            <input type="text" name="username"
                   required autocomplete="username">

            <label>Password</label>
            <input type="password" name="password"
                   required autocomplete="current-password">

            <button type="submit">Login</button>
        </form>
    </div>
</body>
</html>
