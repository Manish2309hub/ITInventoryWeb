
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Asset Status Master</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f4f8;
            margin: 0;
            padding: 30px;
        }

        .container {
            background: white;
            padding: 25px;
            border-radius: 8px;
        }

        h1 {
            color: #1d4f80;
        }

        input {
            padding: 10px;
            width: 250px;
        }

        button {
            background: #1d4f80;
            color: white;
            border: none;
            padding: 11px 18px;
            cursor: pointer;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th {
            background: #1d4f80;
            color: white;
            padding: 12px;
            text-align: left;
        }

        td {
            border: 1px solid #ddd;
            padding: 10px;
        }

        .enabled {
            color: green;
        }

        .disabled {
            color: red;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Asset Status Master</h1>

    <p>
        <a href="{{ url_for('home') }}">Home</a>
        |
        <a href="{{ url_for('asset_list') }}">
            IT Asset Register
        </a>
    </p>

    <h3>Add New Status</h3>

    <form method="POST">

        <input type="hidden"
               name="csrf_token"
               value="{{ session['csrf_token'] }}">

        <input type="text"
               name="status_name"
               placeholder="Enter status name"
               maxlength="50"
               required>

        <button type="submit">
            Save Status
        </button>

    </form>

    <h3>Existing Statuses</h3>

    <table>
        <tr>
            <th>ID</th>
            <th>Status Name</th>
            <th>Status</th>
        </tr>

        {% for status in statuses %}
        <tr>
            <td>{{ status.id }}</td>

            <td>{{ status.status_name }}</td>

            <td>
                {% if status.is_active == 1 %}
                    <span class="enabled">Enabled</span>
                {% else %}
                    <span class="disabled">Disabled</span>
                {% endif %}
            </td>
        </tr>
        {% else %}
        <tr>
            <td colspan="3">
                No statuses found.
            </td>
        </tr>
        {% endfor %}

    </table>

</div>

</body>
</html>
