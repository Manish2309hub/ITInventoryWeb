
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Asset Category</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            padding: 30px;
        }
        .form-box {
            background: white;
            max-width: 500px;
            margin: auto;
            padding: 25px;
            border-radius: 8px;
        }
        input, button {
            padding: 10px;
            box-sizing: border-box;
            width: 100%;
            margin-top: 12px;
        }
        button {
            background: #174a7e;
            color: white;
            border: none;
            cursor: pointer;
        }
        .error { color: red; }
    </style>
</head>
<body>

<div class="form-box">

    <h2>Edit Asset Category</h2>

    {% with messages = get_flashed_messages() %}
        {% for message in messages %}
            <p class="error">{{ message }}</p>
        {% endfor %}
    {% endwith %}

    <form method="POST">

        <input type="hidden"
               name="csrf_token"
               value="{{ session['csrf_token'] }}">

        <label>Category Name</label>

        <input type="text"
               name="category_name"
               value="{{ category.category_name }}"
               maxlength="100"
               required>

        <button type="submit">
            Update Category
        </button>

    </form>

    <p>
        <a href="{{ url_for('category_list') }}">
            Back to Category Master
        </a>
    </p>

</div>

</body>
</html>
