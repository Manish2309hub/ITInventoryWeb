
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add IT Asset</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            padding: 30px;
        }
        .form-box {
            background: white;
            padding: 25px;
            max-width: 550px;
            margin: auto;
            border-radius: 8px;
        }
        label {
            display: block;
            margin-top: 12px;
        }
        input, select, button {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            margin-top: 5px;
        }
        button {
            background: #174a7e;
            color: white;
            border: none;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<div class="form-box">
    <h2>Add New IT Asset</h2>

    {% with messages = get_flashed_messages() %}
        {% for message in messages %}
            <p style="color:red">{{ message }}</p>
        {% endfor %}
    {% endwith %}

    <form method="POST">
        <input type="hidden" name="csrf_token"
               value="{{ csrf_token }}">

        <label>Asset Code</label>
        <input name="asset_code" required>

        <label>Asset Name</label>
        <input name="asset_name" required>

        <label>Serial Number</label>
        <input name="serial_number">

        <label>Brand</label>
        <input name="brand">

        <label>Model</label>
        <input name="model">

        <label>Category</label>
        <select name="category_id" required>
            {% for category in categories %}
                <option value="{{ category.id }}">
                    {{ category.category_name }}
                </option>
            {% endfor %}
        </select>

        <label>Branch</label>
        <select name="branch_id" required>
            {% for branch in branches %}
                <option value="{{ branch.id }}">
                    {{ branch.branch_name }}
                </option>
            {% endfor %}
        </select>

        <!-- <label>Status</label>
        <select name="status">
            <option>Active</option>
            <option>Repair</option>
            <option>Spare</option>
            <option>Obsolete</option>
        </select> -->

        <label>Status</label>
        <select name="status" required>
            <option value="">-- Select Status --</option>

            {% for status in statuses %}
                <option value="{{ status.status_name }}">
                    {{ status.status_name }}
                </option>
            {% endfor %}

        </select>



        <button type="submit">Save Asset</button>
    </form>

    <p>
        <a href="{{ url_for('asset_list') }}">
            Back to Asset Register
        </a>
    </p>
</div>

</body>
</html>
